# Builds the React/Vite frontend and publishes it to GitHub Pages.
#
# One-time setup (see the deployment README for full steps):
#   1. Repo Settings -> Pages -> Source -> "GitHub Actions".
#   2. Repo Settings -> Secrets and variables -> Actions ->
#      "Variables" tab -> New repository variable:
#        VITE_API_BASE_URL = https://<your-render-service>.onrender.com
#      (This is a public URL, not a secret, but Variables work fine
#      for it and keep it out of the workflow file itself.)
#   3. Push to the branch this workflow watches (see `on.push.branches`
#      below - defaults to cloud-demo so it never touches main/local).
#
# GITHUB_REPOSITORY (owner/repo) is provided automatically by GitHub
# Actions - it's used below to compute the GitHub Pages base path
# (/<repo-name>/) so built asset URLs resolve correctly on a project
# site.

name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [cloud-demo]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
